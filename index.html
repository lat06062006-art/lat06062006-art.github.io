<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEARAI - Tủ Đồ Số & Trợ Lý Phối Đồ Thông Minh</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #06b6d4;
            --accent: #f43f5e;
            --success: #10b981;
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; }

        /* AUTH CONTAINER (ĐĂNG NHẬP / ĐĂNG KÝ) */
        #auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            padding: 20px;
        }

        .auth-card {
            background: var(--surface);
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-header h2 { font-size: 28px; font-weight: 800; color: var(--primary); }
        .auth-header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

        .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .auth-tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 600; cursor: pointer; color: var(--text-muted); }
        .auth-tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }

        /* MAIN APP LAYOUT */
        #app-screen { display: none; min-height: 100vh; }
        aside { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 32px; padding: 0 12px; }
        
        .nav-group { margin-bottom: 20px; }
        .nav-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; margin-bottom: 12px; padding: 0 12px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: 8px; font-weight: 500; margin-bottom: 4px; cursor: pointer; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: #eeef2ff; color: var(--primary); }
        .nav-item i { width: 20px; text-align: center; font-size: 18px; }

        .user-profile-menu { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e0e7ff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; }
        
        main { flex: 1; margin-left: 260px; padding: 32px; max-width: 1400px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .page-title h1 { font-size: 26px; font-weight: 700; }
        .page-title p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* COMPONENTS */
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #f1f5f9; color: var(--text-main); }
        .btn-success { background: var(--success); color: white; }

        .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary); }

        /* WARDROBE CARD */
        .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: relative; transition: all 0.2s; }
        .item-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
        .item-img { height: 180px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; position: relative; }
        .item-img img { max-height: 80%; max-width: 80%; object-fit: contain; }
        .item-badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .item-body { padding: 14px; }

        /* WEATHER WIDGET */
        .weather-widget { background: linear-gradient(135deg, #4f46e5, #06b6d4); color: white; padding: 20px; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .weather-temp { font-size: 32px; font-weight: 700; }

        /* STATS CARD */
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; }
        .stat-val { font-size: 28px; font-weight: 800; color: var(--primary); margin: 8px 0; }
        .stat-lbl { font-size: 13px; color: var(--text-muted); }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #f8fafc; font-weight: 600; color: var(--text-muted); }
